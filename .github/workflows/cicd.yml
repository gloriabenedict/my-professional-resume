name: my first pipeline

on:
    push:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest # macos, windows-latest
        steps:
            - name: clone the code
              uses: actions/checkout@v4
            - name: Build image
              run:
                docker build -t gloriab/cicd-portfolio .
            - name: Docker login
              uses: docker/login-action@v3
              with: 
                username: gloriab
                password: ${{ secrets.DOCKER_PASS }}
            - name: Push image
              run:
                docker push gloriab/cicd-portfolio 

